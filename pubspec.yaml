dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  auto_route_generator: ^10.6.0
  build_runner: ^2.15.1
  drift_dev: 2.34.5
  flutter_gen_runner: ^5.15.0

flutter_gen:
