name: files_downloader
description: >-
  Resumable HTTP downloads of any files in slices, in a background isolate.
  Slice progress of a download lives in one binary state file.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.1
  ffi: ^2.2.0
  path: ^1.9.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.2
